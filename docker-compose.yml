version: "3.9"

services:
  nextapp:
    container_name: nextapp
    build: .
    ports:
      - "3000:3000"
  local-db:
    image: postgres
    ports: # map default postgres port to 5454
      - "5454:5432"
    environment:
      POSTGRES_DB: technical-test
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
